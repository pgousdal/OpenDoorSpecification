[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ods-tools"
version = "0.1.0"
description = "Research and validation tools for Open Door Specification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ods = "ods_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
